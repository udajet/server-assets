name: Temporary build Japan historical railways

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/tmp-build-japan-historical-railways.yml
  pull_request:
    branches: [main]
    paths:
      - tools/historical_railway_build_request.txt

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade requests pyshp
      - name: Download and patch builder
        run: |
          curl -fsSL 'https://raw.githubusercontent.com/udajet/server-assets/tmp-build-japan-historical-railways-v4/tools/build_japan_historical_railways.py' -o /tmp/build_japan_historical_railways.py
          python - <<'PY'
          from pathlib import Path
          p = Path('/tmp/build_japan_historical_railways.py')
          s = p.read_text(encoding='utf-8')
          old = '''    if path.suffix.lower() in {".json", ".geojson"}:
        with path.open(encoding="utf-8") as f:
            obj = json.load(f)
        return obj.get("features", [])'''
          new = '''    if path.suffix.lower() in {".json", ".geojson"}:
        raw = path.read_bytes()
        text = None
        for enc in ("utf-8-sig", "cp932", "shift_jis"):
            try:
                text = raw.decode(enc)
                break
            except UnicodeDecodeError:
                pass
        if text is None:
            text = raw.decode("utf-8", errors="replace")
        obj = json.loads(text)
        return obj.get("features", [])'''
          if old not in s:
              raise SystemExit('encoding patch target not found')
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY
      - name: Build and publish temporary result
        shell: bash
        run: |
          set +e
          python /tmp/build_japan_historical_railways.py > /tmp/build.log 2>&1
          code=$?
          set -e
          mkdir -p generated/historical_railways_build
          cp /tmp/build.log generated/historical_railways_build/build.log
          if [ -f out_historical_railways/Japan_PublicData_Maximum_Historical_Railways.kmz ]; then
            cp out_historical_railways/Japan_PublicData_Maximum_Historical_Railways.kmz generated/historical_railways_build/
          fi
          if [ -f out_historical_railways/coverage_report.json ]; then
            cp out_historical_railways/coverage_report.json generated/historical_railways_build/
          fi
          printf '{"exit_code":%s,"completed_utc":"%s"}\n' "$code" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > generated/historical_railways_build/status.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add generated/historical_railways_build
          git commit -m 'Temporary historical railway KMZ build result' || true
          git push origin main
