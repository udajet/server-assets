name: Probe offline railway build trigger

on:
  pull_request:
    branches: [main]
    paths:
      - tools/offline_historical_railway_build_trigger_v2.txt

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Write probe marker
        run: |
          mkdir -p generated/historical_railways_build
          printf '{"probe":"ok","run_id":%s,"sha":"%s"}\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" > generated/historical_railways_build/probe.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add generated/historical_railways_build/probe.json
          git commit -m 'Store Actions probe marker [skip ci]' || true
          git push origin main
