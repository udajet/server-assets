name: Build offline Japan historical railways KMZ

on:
  push:
    branches: [main]
    paths:
      - tools/offline_historical_railway_build_trigger.txt
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

timeout-minutes: 240

concurrency:
  group: offline-japan-historical-railways
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 230
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Check completed marker
        id: gate
        shell: bash
        run: |
          if python - <<'PY'
          import json
          from pathlib import Path
          p=Path('generated/historical_railways_build/status.json')
          ok=False
          if p.exists():
              try:
                  ok=json.loads(p.read_text()).get('exit_code') == 0
              except Exception:
                  pass
          raise SystemExit(0 if ok else 1)
          PY
          then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
          else
            echo 'skip=false' >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.skip != 'true'
        with:
          python-version: '3.12'

      - name: Install dependencies
        if: steps.gate.outputs.skip != 'true'
        run: python -m pip install --upgrade requests pyshp

      - name: Download and patch builder
        if: steps.gate.outputs.skip != 'true'
        shell: bash
        run: |
          curl -fsSL 'https://raw.githubusercontent.com/udajet/server-assets/tmp-build-japan-historical-railways-v4/tools/build_japan_historical_railways.py' -o /tmp/build_historical_railways.py
          python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/build_historical_railways.py')
          s=p.read_text(encoding='utf-8')

          old='''    if path.suffix.lower() in {".json", ".geojson"}:
        with path.open(encoding="utf-8") as f:
            obj = json.load(f)
        return obj.get("features", [])'''
          new='''    if path.suffix.lower() in {".json", ".geojson"}:
        raw = path.read_bytes()
        text = None
        for enc in ("utf-8-sig", "cp932", "shift_jis"):
            try:
                text = raw.decode(enc)
                break
            except UnicodeDecodeError:
                pass
        if text is None:
            text = raw.decode("utf-8", errors="replace")
        obj = json.loads(text)
        return obj.get("features", [])'''
          if old not in s:
              raise SystemExit('encoding patch target missing')
          s=s.replace(old,new)

          s=s.replace('operator = p.get("N05_001") or p.get("事業者名") or p.get("operator")',
                      'operator = p.get("N05_003") or p.get("事業者名") or p.get("operator") or p.get("N05_001")')
          s=s.replace('TRACK_RE = "^(rail|tram|light_rail|subway|narrow_gauge|monorail|funicular|preserved|abandoned|disused|razed|dismantled|historic)$"',
                      'TRACK_RE = "^(rail|tram|light_rail|subway|narrow_gauge|monorail|funicular|preserved|miniature|abandoned|disused|razed|dismantled|demolished|removed|historic)$"')
          s=s.replace('HIST_VALUES = {"abandoned", "disused", "razed", "dismantled", "historic"}',
                      'HIST_VALUES = {"abandoned", "disused", "razed", "dismantled", "demolished", "removed", "historic"}')
          s=s.replace('"razed:railway", "removed:railway", "former:railway", "was:railway",',
                      '"razed:railway", "dismantled:railway", "removed:railway", "former:railway", "was:railway",')
          s=s.replace('<IconStyle><scale>0.55</scale><Icon><href>http://maps.google.com/mapfiles/kml/shapes/rail.png</href></Icon></IconStyle>',
                      '<IconStyle><scale>0.55</scale></IconStyle>')
          s=s.replace('text = dest.read_text(encoding="utf-8", errors="ignore")\n            lines = len(re.findall(r"<LineString\\b", text, flags=re.I))',
                      'text = dest.read_text(encoding="utf-8", errors="ignore")\n            text = re.sub(r"<Icon>\\s*<href>https?://.*?</href>\\s*</Icon>", "<Icon/>", text, flags=re.I|re.S)\n            dest.write_text(text, encoding="utf-8")\n            lines = len(re.findall(r"<LineString\\b", text, flags=re.I))')
          s=s.replace('Japan_PublicData_Maximum_Historical_Railways.kmz', 'Japan_Historical_Railways_Offline_MaxCoverage.kmz')
          s=s.replace('UA = "JapanHistoricalRailwaysKMZ/1.0 (public-data integration build)"',
                      'UA = "JapanHistoricalRailwaysKMZ/2.0 (offline public-data integration build; contact via GitHub udajet)"')
          p.write_text(s,encoding='utf-8')
          PY

      - name: Build KMZ
        if: steps.gate.outputs.skip != 'true'
        id: build
        shell: bash
        run: |
          set +e
          python /tmp/build_historical_railways.py > /tmp/build.log 2>&1
          code=$?
          set -e
          echo "$code" > /tmp/build_exit_code
          tail -n 200 /tmp/build.log || true

      - name: Prepare build package
        if: steps.gate.outputs.skip != 'true' && always()
        shell: bash
        run: |
          mkdir -p /tmp/rail-artifact
          cp /tmp/build.log /tmp/rail-artifact/build.log 2>/dev/null || true
          cp /tmp/build_exit_code /tmp/rail-artifact/build_exit_code.txt 2>/dev/null || true
          cp out_historical_railways/Japan_Historical_Railways_Offline_MaxCoverage.kmz /tmp/rail-artifact/ 2>/dev/null || true
          cp out_historical_railways/coverage_report.json /tmp/rail-artifact/ 2>/dev/null || true

      - name: Upload KMZ artifact
        if: steps.gate.outputs.skip != 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: japan-historical-railways-offline-${{ github.run_id }}
          path: /tmp/rail-artifact
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Publish audit status
        if: steps.gate.outputs.skip != 'true' && always()
        shell: bash
        run: |
          mkdir -p generated/historical_railways_build
          cp /tmp/build.log generated/historical_railways_build/build.log 2>/dev/null || true
          cp out_historical_railways/coverage_report.json generated/historical_railways_build/coverage_report.json 2>/dev/null || true
          code=$(cat /tmp/build_exit_code 2>/dev/null || echo 99)
          size=0
          sha=''
          file='out_historical_railways/Japan_Historical_Railways_Offline_MaxCoverage.kmz'
          if [ -f "$file" ]; then
            size=$(stat -c%s "$file")
            sha=$(sha256sum "$file" | awk '{print $1}')
          fi
          python - <<PY
          import json, time
          from pathlib import Path
          data={
            'exit_code': int('$code'),
            'run_id': int('${GITHUB_RUN_ID}'),
            'artifact_name': 'japan-historical-railways-offline-${GITHUB_RUN_ID}',
            'kmz_bytes': int('$size'),
            'sha256': '$sha',
            'completed_utc': time.strftime('%Y-%m-%dT%H:%M:%SZ', time.gmtime()),
          }
          Path('generated/historical_railways_build/status.json').write_text(json.dumps(data,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add generated/historical_railways_build
          git commit -m 'Store historical railway KMZ build audit [skip rail build]' || true
          git push origin main
