name: Probe MLIT N05 encoding

on:
  pull_request:
    branches: [main]
    paths:
      - tools/mlit_encoding_probe_trigger.txt

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install diagnostics
        run: python -m pip install requests
      - name: Test CP932 JSON repair
        run: |
          python - <<'PY'
          import io, json, re, zipfile
          from pathlib import Path
          import requests

          url='https://nlftp.mlit.go.jp/ksj/gml/data/N05/N05-25/N05-25_GML.zip'
          archive=requests.get(url,timeout=300).content
          z=zipfile.ZipFile(io.BytesIO(archive))
          target=next(n for n in z.namelist() if 'RailroadSection2' in n and n.lower().endswith(('.geojson','.json')))
          raw=z.read(target)
          text=raw.decode('cp932')
          invalid=list(re.finditer(r'\\(?!["\\/bfnrtu])',text))
          repaired=re.sub(r'\\(?!["\\/bfnrtu])',r'\\\\',text)
          obj=json.loads(repaired)
          feats=obj.get('features',[])
          samples=[]
          for feature in feats:
            geom=feature.get('geometry') or {}
            coords=geom.get('coordinates') or []
            flat=coords if geom.get('type')=='LineString' else [p for part in coords for p in part] if geom.get('type')=='MultiLineString' else []
            if any(138.45<=float(p[0])<=138.75 and 35.50<=float(p[1])<=35.80 for p in flat if len(p)>=2):
              props=feature.get('properties') or {}
              samples.append({k:str(v)[:200] for k,v in props.items() if k.startswith('N05')})
              if len(samples)>=10:
                break
          report={
            'target':target,
            'features':len(feats),
            'invalid_backslashes':len(invalid),
            'first_invalid_contexts':[text[max(0,m.start()-50):m.start()+80] for m in invalid[:10]],
            'replacement_characters':repaired.count('\ufffd'),
            'kofu_samples':samples,
          }
          output=json.dumps(report,ensure_ascii=False,indent=2)
          print(output)
          Path('/tmp/mlit_cp932_repair_probe.json').write_text(output,encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mlit-cp932-repair-probe-${{ github.run_id }}
          path: /tmp/mlit_cp932_repair_probe.json
          retention-days: 3
