name: Build Japan historical railways KMZ

on:
  pull_request:
    branches: [main]
    paths:
      - tools/build_japan_historical_railways.py
      - .github/workflows/build-japan-historical-railways.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade requests pyshp
      - name: Build maximum-coverage KMZ
        run: python tools/build_japan_historical_railways.py
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: japan-historical-railways-kmz
          path: |
            out_historical_railways/Japan_PublicData_Maximum_Historical_Railways.kmz
            out_historical_railways/coverage_report.json
          if-no-files-found: error
          compression-level: 0
